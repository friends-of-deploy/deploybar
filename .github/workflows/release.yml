name: Release

# Triggered by pushing a version tag, e.g.:  git tag v1.0.0 && git push origin v1.0.0
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write   # needed to create the GitHub Release and upload the .dmg

jobs:
  release:
    name: Build, sign, notarize & publish
    runs-on: macos-15

    # Hoisted here because `secrets.*` cannot be used in a step-level `if:`.
    # The optional Homebrew step gates on `env.TAP_REPO_TOKEN` instead.
    env:
      TAP_REPO_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Derive version from tag
        id: version
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          # A `-beta` suffix routes the release to the beta channel only, marks
          # the GitHub Release as a prerelease, and skips the Homebrew bump.
          if [[ "$VERSION" == *-beta* ]]; then
            echo "is_beta=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_beta=false" >> "$GITHUB_OUTPUT"
          fi

      # The SDK the app is built against decides which AppKit behaviour it gets
      # at runtime, and that is not cosmetic here: built against the macOS 15
      # SDK (what macos-14 runners carry), clearing the panel window's
      # background makes `MenuBarExtra` draw nothing at all on macOS 26 — the
      # blank panel shipped in 1.0.0-beta and 1.0.2-beta. The same commit built
      # against SDK 27 renders correctly. So the SDK is asserted, not assumed.
      - name: Select latest Xcode
        run: |
          latest="$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)"
          if [ -n "$latest" ]; then sudo xcode-select -s "$latest"; fi
          xcodebuild -version
          SDK="$(xcrun --sdk macosx --show-sdk-version)"
          echo "macOS SDK: $SDK"
          if [ "${SDK%%.*}" -lt 26 ]; then
            echo "::error::macOS SDK $SDK is too old — the panel ships blank on macOS 26. Need SDK 26+."
            exit 1
          fi

      - name: Install tooling
        run: brew install xcodegen create-dmg

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Import Developer ID signing certificate
        env:
          DEVELOPER_ID_CERT_P12: ${{ secrets.DEVELOPER_ID_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.CERT_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          echo "$DEVELOPER_ID_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
            -P "$CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          # Make the temp keychain searchable while keeping the login keychain.
          security list-keychains -d user -s "$KEYCHAIN" "login.keychain-db"
          rm -f "$RUNNER_TEMP/cert.p12"

      - name: Archive (Release)
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          # MARKETING_VERSION comes from the tag so the app always reports the
          # released version regardless of what project.yml carries.
          xcodebuild archive \
            -project DeployBar.xcodeproj \
            -scheme DeployBar \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -archivePath "$RUNNER_TEMP/DeployBar.xcarchive" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            MARKETING_VERSION="${{ steps.version.outputs.version }}" \
            "CODE_SIGN_IDENTITY=Developer ID Application"

      - name: Export signed .app
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          sed "s/__TEAM_ID__/$APPLE_TEAM_ID/" .github/release/ExportOptions.plist > "$RUNNER_TEMP/ExportOptions.plist"
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/DeployBar.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"

      - name: Build .dmg
        id: dmg
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          DMG="$RUNNER_TEMP/DeployBar-$VERSION.dmg"
          create-dmg \
            --volname "DeployBar $VERSION" \
            --window-size 540 380 \
            --icon-size 100 \
            --icon "DeployBar.app" 140 190 \
            --app-drop-link 400 190 \
            "$DMG" \
            "$RUNNER_TEMP/export/DeployBar.app"
          echo "path=$DMG" >> "$GITHUB_OUTPUT"

      - name: Build .zip for Sparkle
        id: zip
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          ZIP="$RUNNER_TEMP/DeployBar-$VERSION.zip"
          # ditto preserves the bundle's symlinks and resource forks; `zip`
          # does not, and a mangled bundle fails Gatekeeper on the other side.
          ditto -c -k --sequesterRsrc --keepParent \
            "$RUNNER_TEMP/export/DeployBar.app" "$ZIP"
          echo "path=$ZIP" >> "$GITHUB_OUTPUT"

      - name: Notarize & staple
        env:
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
          NOTARY_KEY_P8: ${{ secrets.NOTARY_KEY_P8 }}
        run: |
          set -euo pipefail
          echo "$NOTARY_KEY_P8" | base64 --decode > "$RUNNER_TEMP/notary.p8"

          submit() {
            xcrun notarytool submit "$1" \
              --key "$RUNNER_TEMP/notary.p8" \
              --key-id "$NOTARY_KEY_ID" \
              --issuer "$NOTARY_ISSUER_ID" \
              --wait
          }

          submit "${{ steps.dmg.outputs.path }}"
          xcrun stapler staple "${{ steps.dmg.outputs.path }}"

          # A .zip cannot be stapled; staple the .app and repack, so the
          # unpacked copy carries its notarization ticket offline.
          submit "${{ steps.zip.outputs.path }}"
          xcrun stapler staple "$RUNNER_TEMP/export/DeployBar.app"
          rm -f "${{ steps.zip.outputs.path }}"
          ditto -c -k --sequesterRsrc --keepParent \
            "$RUNNER_TEMP/export/DeployBar.app" "${{ steps.zip.outputs.path }}"

          rm -f "$RUNNER_TEMP/notary.p8"

      - name: Compute SHA-256
        id: sha
        run: |
          SHA="$(shasum -a 256 "${{ steps.dmg.outputs.path }}" | awk '{print $1}')"
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"
          echo "### Cask values" >> "$GITHUB_STEP_SUMMARY"
          echo '```ruby' >> "$GITHUB_STEP_SUMMARY"
          echo "version \"${{ steps.version.outputs.version }}\"" >> "$GITHUB_STEP_SUMMARY"
          echo "sha256 \"$SHA\"" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.dmg.outputs.path }}
            ${{ steps.zip.outputs.path }}
          generate_release_notes: true
          prerelease: ${{ steps.version.outputs.is_beta == 'true' }}

      - name: Sign update & append to appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          IS_BETA: ${{ steps.version.outputs.is_beta }}
          ZIP_PATH: ${{ steps.zip.outputs.path }}
        run: |
          set -euo pipefail

          # Sparkle's signing tool, fetched rather than built: the release
          # archive carries prebuilt binaries.
          SPARKLE_VERSION="2.6.4"
          curl -fsSL -o "$RUNNER_TEMP/sparkle.tar.xz" \
            "https://github.com/sparkle-project/Sparkle/releases/download/$SPARKLE_VERSION/Sparkle-$SPARKLE_VERSION.tar.xz"
          mkdir -p "$RUNNER_TEMP/sparkle"
          tar xf "$RUNNER_TEMP/sparkle.tar.xz" -C "$RUNNER_TEMP/sparkle"
          SIGN_UPDATE="$RUNNER_TEMP/sparkle/bin/sign_update"

          echo "$SPARKLE_PRIVATE_KEY" > "$RUNNER_TEMP/sparkle_key"
          # sign_update prints: sparkle:edSignature="..." length="..."
          SIGN_OUTPUT="$("$SIGN_UPDATE" "$ZIP_PATH" -f "$RUNNER_TEMP/sparkle_key")"
          rm -f "$RUNNER_TEMP/sparkle_key"

          SIGNATURE="$(echo "$SIGN_OUTPUT" | sed -E 's/.*edSignature="([^"]+)".*/\1/')"
          if [ -z "$SIGNATURE" ] || [ "$SIGNATURE" = "$SIGN_OUTPUT" ]; then
            echo "could not parse a signature out of: $SIGN_OUTPUT" >&2
            exit 1
          fi

          LENGTH="$(stat -f%z "$ZIP_PATH")"
          BUILD="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' \
            "$RUNNER_TEMP/export/DeployBar.app/Contents/Info.plist")"
          ZIP_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/$(basename "$ZIP_PATH")"

          gh release view "$GITHUB_REF_NAME" --json body --jq .body > "$RUNNER_TEMP/notes.md"

          git clone --branch gh-pages --single-branch \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$RUNNER_TEMP/pages"

          append() {
            ./scripts/append-appcast.sh "$RUNNER_TEMP/pages/$1" \
              "$VERSION" "$BUILD" "$ZIP_URL" "$LENGTH" "$SIGNATURE" "$RUNNER_TEMP/notes.md"
          }

          # Beta testers should also receive stable releases, so a stable build
          # goes to both feeds; a beta build goes only to the beta feed.
          append appcast-beta.xml
          if [ "$IS_BETA" != "true" ]; then
            append appcast.xml
          fi

          xmllint --noout "$RUNNER_TEMP/pages/appcast.xml" "$RUNNER_TEMP/pages/appcast-beta.xml"

          cd "$RUNNER_TEMP/pages"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add appcast.xml appcast-beta.xml
          git commit -m "deploybar $VERSION"
          git push

      # --- Optional: auto-bump the Homebrew cask in friends-of-deploy/homebrew-tap ---
      # Requires a TAP_REPO_TOKEN secret (a PAT with `contents:write` on the tap repo).
      # Remove this step if you prefer to update the cask by hand.
      - name: Bump Homebrew cask
        # The cask tracks stable only — a beta must never bump it.
        if: ${{ env.TAP_REPO_TOKEN != '' && steps.version.outputs.is_beta == 'false' }}
        env:
          GH_TOKEN: ${{ env.TAP_REPO_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          SHA256: ${{ steps.sha.outputs.sha256 }}
        run: |
          set -euo pipefail
          git clone "https://x-access-token:$GH_TOKEN@github.com/friends-of-deploy/homebrew-tap.git" tap
          cd tap
          CASK="Casks/deploybar.rb"
          sed -i '' -E "s/version \"[^\"]*\"/version \"$VERSION\"/" "$CASK"
          sed -i '' -E "s/sha256 \"[^\"]*\"/sha256 \"$SHA256\"/" "$CASK"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -am "deploybar $VERSION"
          git push
