name: DeployBar
options:
  bundleIdPrefix: io.eightlines.deploybar
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  developmentLanguage: en
  knownRegions:
    - en
    - pl

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal

targets:
  DeployBar:
    type: application
    platform: macOS
    sources:
      - DeployBar
    entitlements:
      path: DeployBar/DeployBar.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.eightlines.deploybar.DeployBar
        INFOPLIST_KEY_LSUIElement: "YES"
        INFOPLIST_KEY_CFBundleDisplayName: DeployBar
        INFOPLIST_KEY_CFBundleDevelopmentRegion: en
        GENERATE_INFOPLIST_FILE: "YES"
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        # Default (Debug + CI): unsigned, no certs needed.
        CODE_SIGN_STYLE: Automatic
        CODE_SIGNING_ALLOWED: "NO"
      configs:
        # Release: Developer ID signing + Hardened Runtime, required for notarization.
        # The signing identity is supplied at build time via xcodebuild
        # (CODE_SIGN_IDENTITY / DEVELOPMENT_TEAM), so local Release builds
        # without a cert still work by overriding CODE_SIGNING_ALLOWED=NO.
        Release:
          CODE_SIGNING_ALLOWED: "YES"
          CODE_SIGN_STYLE: Manual
          ENABLE_HARDENED_RUNTIME: "YES"
          OTHER_CODE_SIGN_FLAGS: "--timestamp"

  DeployBarTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: DeployBarTests
        excludes:
          - Fixtures
      - path: DeployBarTests/Fixtures
        buildPhase: resources
    dependencies:
      - target: DeployBar
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.eightlines.deploybar.DeployBarTests
        CODE_SIGNING_ALLOWED: "NO"

schemes:
  DeployBar:
    build:
      targets:
        DeployBar: all
    test:
      targets:
        - DeployBarTests
    run:
      config: Debug
