name: DeployBar
options:
  bundleIdPrefix: io.eightlines.deploybar
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  developmentLanguage: en
  knownRegions:
    - en
    - pl

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal

packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    majorVersion: 2.6.0

targets:
  DeployBar:
    type: application
    platform: macOS
    sources:
      - DeployBar
    entitlements:
      path: DeployBar/DeployBar.entitlements
    dependencies:
      - package: Sparkle
    # Sparkle needs custom Info.plist keys, and the INFOPLIST_KEY_ build
    # settings only carry Apple's own keys — anything else is dropped without
    # a warning. So the plist is generated here instead, and
    # GENERATE_INFOPLIST_FILE is off below.
    info:
      path: DeployBar/Info.plist
      properties:
        CFBundleDisplayName: DeployBar
        CFBundleDevelopmentRegion: en
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSHumanReadableCopyright: ""
        # The public key is public by design — an installed copy uses it to
        # verify that an update was signed by the matching private key, which
        # lives only in the SPARKLE_PRIVATE_KEY Actions secret and the
        # maintainer's login Keychain.
        #
        SUPublicEDKey: ALXbpEEByW2KIAMtGC69OHKfoA0ghWfqNkvT0xXTIvA=
        # First-launch default only. Once the user has a channel preference,
        # UpdaterController's delegate supplies the feed URL instead.
        SUFeedURL: https://friends-of-deploy.github.io/deploybar/appcast.xml
        SUEnableAutomaticChecks: true
        SUAllowsAutomaticUpdates: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.eightlines.deploybar.DeployBar
        # Off: the plist is generated from the `info:` block above, because
        # Sparkle's custom keys cannot travel through INFOPLIST_KEY_ settings.
        GENERATE_INFOPLIST_FILE: "NO"
        # Assets.xcassets is picked up automatically from the `DeployBar` source
        # directory; this names the app icon set inside it.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "1.2.0"
        CURRENT_PROJECT_VERSION: "4"
        # Sparkle's keys are set under `info:` below, not here: the
        # INFOPLIST_KEY_ prefix only carries Apple's known keys into a
        # generated plist, and silently drops anything else.
        # Default (CI): unsigned, no certs needed.
        CODE_SIGN_STYLE: Automatic
        CODE_SIGNING_ALLOWED: "NO"
      configs:
        # Debug: properly signed, because Sparkle 2 refuses to start its updater
        # in a host whose resources are not sealed — an ad-hoc signed build
        # fails with "The updater failed to start" before it ever reads a feed.
        # CI overrides this with CODE_SIGNING_ALLOWED=NO, which is why the
        # unsigned build still works there.
        Debug:
          CODE_SIGNING_ALLOWED: "YES"
          CODE_SIGN_STYLE: Automatic
          CODE_SIGN_IDENTITY: "Apple Development"
          DEVELOPMENT_TEAM: 7S3F9767BM
          # Xcode's debug-dylib ("Previews") mode splits the binary into a thin
          # launcher stub plus a dylib, and the notification daemon then
          # attributes requests to the dylib's identity instead of the bundle's,
          # so every addRequest is rejected. Keep the app a single binary.
          ENABLE_DEBUG_DYLIB: "NO"
        # Release: Developer ID signing + Hardened Runtime, required for notarization.
        # The signing identity is supplied at build time via xcodebuild
        # (CODE_SIGN_IDENTITY / DEVELOPMENT_TEAM), so local Release builds
        # without a cert still work by overriding CODE_SIGNING_ALLOWED=NO.
        Release:
          CODE_SIGNING_ALLOWED: "YES"
          CODE_SIGN_STYLE: Manual
          ENABLE_HARDENED_RUNTIME: "YES"
          OTHER_CODE_SIGN_FLAGS: "--timestamp"

  DeployBarTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: DeployBarTests
        excludes:
          - Fixtures
      - path: DeployBarTests/Fixtures
        buildPhase: resources
    dependencies:
      - target: DeployBar
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.eightlines.deploybar.DeployBarTests
        CODE_SIGNING_ALLOWED: "NO"

schemes:
  DeployBar:
    build:
      targets:
        DeployBar: all
    test:
      targets:
        - DeployBarTests
    run:
      config: Debug
